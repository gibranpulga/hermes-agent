name: Validated AgentDesk release
on:
  push:
    branches: [main]
permissions: {}
# The explicit SHA/sequence publication fence also handles reversed queue order.
concurrency:
  group: agentdesk-release
  cancel-in-progress: false
env:
  PYTHONPATH: .
  HERMES_IMAGE_REPOSITORY: ${{ vars.HERMES_IMAGE_REPOSITORY }}
jobs:
  build:
    if: github.repository == 'gibranpulga/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reserve disposable runner disk for tested installation archives
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          printf 'AGENTDESK_RELEASE_DIR=%s/agentdesk-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: ./.github/actions/setup-pm
        with:
          test-environment: true
          cache-python: true
          prune-python-cache: true
      - name: Required regression and lint checks
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 scripts/check
          scripts/run_tests.sh tests/hermes_cli/test_update_inventory.py tests/hermes_cli/test_update_restart_recovery.py tests/hermes_cli/test_serve_runtime_inventory.py tests/scripts/agentdesk
          mkdir -p "$AGENTDESK_RELEASE_DIR"
          printf '{"regression":true}\n' > "$AGENTDESK_RELEASE_DIR/regression.json"
      - name: Prepare canonical locked runtime build
        run: |
          mkdir -p "$AGENTDESK_RELEASE_DIR"
          cat Dockerfile scripts/agentdesk/image.Dockerfile > "$RUNNER_TEMP/agentdesk-release.Dockerfile"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build using canonical locked runtime and compiled dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ${{ runner.temp }}/agentdesk-release.Dockerfile
          target: agentdesk_image
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: hermes-release:candidate
          load: true
          github-token: ''
          cache-from: type=gha,scope=agentdesk-release
          cache-to: type=gha,scope=agentdesk-release,mode=max,ignore-error=true
      - name: Export and reload exact installation artifact
        run: |
          docker image inspect --format '{{.Id}}' hermes-release:candidate > "$AGENTDESK_RELEASE_DIR/image-id"
          docker save hermes-release:candidate | gzip -1 > "$AGENTDESK_RELEASE_DIR/hermes-image.tar.gz"
          docker image rm hermes-release:candidate
          gzip -dc "$AGENTDESK_RELEASE_DIR/hermes-image.tar.gz" | docker load
      - name: Build and validate the offline native payload using PM bundling
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          image_container=$(docker create "$(cat "$AGENTDESK_RELEASE_DIR/image-id")")
          docker cp "$image_container:/opt/hermes/hermes_cli/web_dist" "$RUNNER_TEMP/web-dist"
          docker rm "$image_container"
          docker builder prune -af
          python3 scripts/bundles/native_build.py --source "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/native-work" --cache "$RUNNER_TEMP/native-cache" --out "$RUNNER_TEMP/native-payload" --ref "$CANDIDATE" --prepare-only
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.bundles.native import finish_native
          root = Path(os.environ['RUNNER_TEMP'])
          raise SystemExit(finish_native(root / 'native-payload.prepared.json', {'web': root / 'web-dist'}))
          PYTHON
          python3 scripts/write_install_stamp.py --output "$RUNNER_TEMP/native-payload/hermes-agent/install-stamp.json" --commit "$CANDIDATE" --source ci --update-mechanism external --runtime-dir ..
          sudo --preserve-env=PATH unshare --net bash scripts/smoke-payload.sh "$RUNNER_TEMP/native-payload"
          tar -C "$RUNNER_TEMP/native-payload" -czf "$AGENTDESK_RELEASE_DIR/hermes-native.tar.gz" .
          python3 scripts/agentdesk/native_lifecycle.py "$AGENTDESK_RELEASE_DIR/hermes-native.tar.gz" "$CANDIDATE" "$AGENTDESK_RELEASE_DIR/native-lifecycle.json"
          rm -rf "$RUNNER_TEMP/native-work" "$RUNNER_TEMP/native-cache" "$RUNNER_TEMP/native-payload" "$RUNNER_TEMP/web-dist"
          docker system prune -af
      # One short-lived cross-job transfer; images are never release assets.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-image
          path: ${{ env.AGENTDESK_RELEASE_DIR }}/hermes-image.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-candidate
          path: |
            ${{ env.AGENTDESK_RELEASE_DIR }}/hermes-native.tar.gz
            ${{ env.AGENTDESK_RELEASE_DIR }}/native-lifecycle.json
            ${{ env.AGENTDESK_RELEASE_DIR }}/regression.json
          compression-level: 0
          retention-days: 1
  upload-image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AGENTDESK_RELEASE_DIR: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-image
          path: ${{ env.AGENTDESK_RELEASE_DIR }}
      - name: Authenticate publisher without executing candidate code
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Upload candidate; this does not authorize installation
        run: python3 scripts/agentdesk/publication.py push-image
      - name: Remove publisher authentication
        if: always()
        run: docker logout docker.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-candidate
          path: ${{ env.AGENTDESK_RELEASE_DIR }}/image.json
          retention-days: 1
  validate-image:
    needs: upload-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AGENTDESK_RELEASE_DIR: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: registry-candidate
          path: ${{ env.AGENTDESK_RELEASE_DIR }}
      - name: Authenticate read-only validator
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Pull and verify exact registry digest on a clean daemon
        run: python3 scripts/agentdesk/publication.py pull-image
      - name: Remove registry authentication before executing candidate
        if: always()
        run: docker logout docker.io
      - name: Exercise exact pulled installation, restart, health and recovery
        run: |
          image=$(python3 -c 'import json,os; print(json.load(open(os.environ["AGENTDESK_RELEASE_DIR"]+"/image.json"))["imageId"])')
          python3 scripts/agentdesk/lifecycle.py "$image" "$GITHUB_SHA" "$AGENTDESK_RELEASE_DIR/lifecycle.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-validation
          path: |
            ${{ env.AGENTDESK_RELEASE_DIR }}/image.json
            ${{ env.AGENTDESK_RELEASE_DIR }}/lifecycle.json
          retention-days: 1
  release:
    needs: [build, validate-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      AGENTDESK_RELEASE_DIR: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-candidate
          path: ${{ env.AGENTDESK_RELEASE_DIR }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: registry-validation
          path: ${{ env.AGENTDESK_RELEASE_DIR }}
      - name: Bind required validation to the immutable release record
        run: python3 scripts/agentdesk/publication.py record
      - name: Attest validated release record
        if: github.ref == 'refs/heads/main'
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ env.AGENTDESK_RELEASE_DIR }}/release.json
      - name: Publish only if candidate remains current and newer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$AGENTDESK_RELEASE_DIR/release.json.sigstore"
          python3 scripts/agentdesk/publication.py publish
